services:
  postgres:
    image: postgres:16-alpine
    container_name: gpr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gastos_reference
    ports:
      - "5432:5432"
    volumes:
      - gpr-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gastos_reference"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  gpr-postgres-data:
    name: gpr-postgres-data